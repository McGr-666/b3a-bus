<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e5dac1">
<title>B3A · 富泰邨 ⇄ 深圳灣口岸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Oswald:wght@400;500;600&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --desk: #e5dac1;
    --paper: #faf5e8;
    --paper-2: #f4ecda;
    --ink: #24352f;
    --ink-2: #5b6a60;
    --rule: rgba(36, 53, 47, .34);
    --rule-soft: rgba(36, 53, 47, .16);
    --brick: #b03a2b;
    --pine: #1b6a55;
    --gold: #9c7a34;
    --serif: "Playfair Display", Georgia, "Times New Roman", serif;
    --sans: "Oswald", "Helvetica Neue", Arial, sans-serif;
    --cjk: "Noto Serif TC", "Songti SC", "PingFang HK", serif;
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 18px;
    background-color: var(--desk);
    color: var(--ink);
    font-family: var(--cjk);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- ticket shell ---------- */
  .ticket {
    position: relative;
    width: 100%;
    max-width: 760px;
    background: linear-gradient(180deg, var(--paper), var(--paper-2));
    border: 1px solid rgba(36, 53, 47, .55);
    border-radius: 3px;
    box-shadow:
      0 20px 44px rgba(36, 53, 47, .17),
      0 1px 0 rgba(255, 255, 255, .7) inset;
  }
  .ticket::before {
    content: "";
    position: absolute;
    inset: 7px;
    border: 1px solid var(--rule-soft);
    border-radius: 2px;
    pointer-events: none;
  }

  /* ---------- tear line + punch holes ---------- */
  .tear {
    position: relative;
    height: 0;
    border-top: 2px dashed var(--rule);
  }
  .punch {
    position: absolute;
    top: -11px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--desk);
    border: 1px solid rgba(36, 53, 47, .38);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, .10);
  }
  .punch.l { left: -11px; }
  .punch.r { right: -11px; }

  /* ---------- masthead ---------- */
  .masthead {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 28px 28px 22px;
  }
  .seal {
    flex: none;
    transform: rotate(-4deg);
    display: grid;
    place-items: center;
    gap: 2px;
    padding: 8px 13px 7px;
    border: 2px solid var(--brick);
    border-radius: 3px;
    color: var(--brick);
    box-shadow:
      inset 0 0 0 2px var(--paper),
      inset 0 0 0 3px var(--brick);
  }
  .seal-route {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 26px;
    line-height: 1;
    letter-spacing: .1em;
  }
  .seal-sub {
    font-family: var(--sans);
    font-weight: 500;
    font-size: 7px;
    letter-spacing: .26em;
    opacity: .85;
  }
  .titles { min-width: 0; }
  .kicker {
    font-family: var(--sans);
    text-transform: uppercase;
    letter-spacing: .28em;
    font-size: 9px;
    color: var(--ink-2);
    margin-bottom: 7px;
  }
  .en {
    margin: 0;
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(17px, 3vw, 22px);
    line-height: 1.2;
    letter-spacing: -.01em;
  }
  .en .arrow {
    color: var(--brick);
    font-weight: 400;
    margin: 0 .14em;
  }
  .zh {
    margin-top: 6px;
    font-family: var(--cjk);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: .14em;
    color: var(--ink-2);
  }

  /* ---------- boards ---------- */
  .board { padding: 22px 28px 12px; }

  .label-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 14px;
    font-family: var(--sans);
    text-transform: uppercase;
    letter-spacing: .19em;
    font-size: 10px;
    color: var(--ink-2);
  }
  .label-row .dir {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    color: var(--ink);
  }
  .label-row .mark {
    flex: none;
    width: 8px;
    height: 8px;
    background: var(--brick);
    display: inline-block;
  }
  .board.secondary .label-row .mark { background: var(--pine); }
  .serial {
    font-size: 9px;
    letter-spacing: .16em;
    white-space: nowrap;
    opacity: .9;
  }

  .next {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 10px 0 18px;
  }
  .num {
    font-family: var(--serif);
    font-weight: 900;
    font-size: clamp(72px, 20vw, 118px);
    line-height: .8;
    letter-spacing: -.035em;
    color: var(--brick);
    font-variant-numeric: tabular-nums lining-nums;
    font-feature-settings: "tnum" 1, "lnum" 1;
  }
  .board.secondary .num { color: var(--pine); }
  .num.small {
    font-size: clamp(34px, 8.5vw, 50px);
    letter-spacing: 0;
  }
  .unit {
    font-family: var(--sans);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .18em;
    font-size: 12px;
    color: var(--ink-2);
    padding-bottom: 6px;
  }
  .meta {
    margin-left: auto;
    text-align: right;
    padding-bottom: 5px;
    font-family: var(--sans);
    color: var(--ink-2);
    line-height: 1.55;
  }
  .meta strong {
    display: block;
    font-family: var(--sans);
    font-weight: 500;
    font-size: 15px;
    letter-spacing: .1em;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .meta span {
    font-size: 9px;
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  .later {
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding: 16px 0 10px;
    border-top: 1px dotted rgba(36, 53, 47, .38);
  }
  .slot {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 8px;
    min-height: 84px;
  }
  .slot + .slot {
    border-left: 1px dotted rgba(36, 53, 47, .38);
    padding-left: 22px;
  }
  .slot .k {
    font-family: var(--sans);
    text-transform: uppercase;
    letter-spacing: .22em;
    font-size: 9px;
    color: var(--ink-2);
  }
  .slot .v {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-family: var(--serif);
    font-weight: 700;
    font-size: 30px;
    line-height: 1;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .slot .v .u {
    font-family: var(--sans);
    font-weight: 400;
    font-size: 9.5px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .slot .t {
    font-family: var(--sans);
    font-size: 10.5px;
    letter-spacing: .1em;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  .slot.empty .v {
    font-family: var(--sans);
    font-weight: 400;
    font-size: 15px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-2);
  }

  .board-note {
    display: none;
    margin: 12px 0 0;
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: .06em;
    color: var(--brick);
  }
  .board-note.show { display: block; }

  /* ---------- footer ---------- */
  footer {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 28px 20px;
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--ink-2);
    flex-wrap: wrap;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--pine);
    flex: none;
  }
  .dot.busy { background: var(--gold); animation: pulse 1.3s infinite; }
  .dot.err { background: var(--brick); }
  @keyframes pulse { 50% { opacity: .3; } }

  footer .spacer { flex: 1; }
  #countdown {
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  button {
    font-family: var(--sans);
    text-transform: uppercase;
    letter-spacing: .16em;
    font-size: 9.5px;
    color: var(--ink);
    background: transparent;
    border: 1px solid rgba(36, 53, 47, .45);
    border-radius: 2px;
    padding: 7px 14px;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  button:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: default; }
  button:disabled:hover { background: transparent; color: var(--ink); }

  #error {
    display: none;
    margin: 0 28px;
    padding: 10px 12px;
    border: 1px solid rgba(176, 58, 43, .45);
    border-left: 3px solid var(--brick);
    background: rgba(176, 58, 43, .05);
    color: var(--brick);
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: .05em;
    line-height: 1.5;
  }
  #error.show { display: block; }

  @media (max-width: 460px) {
    body { padding: 20px 12px; }
    .masthead { padding: 22px 18px 18px; gap: 14px; }
    .seal { padding: 7px 10px 6px; }
    .seal-route { font-size: 22px; }
    .board { padding: 20px 18px 10px; }
    footer { padding: 14px 18px 18px; }
    #error { margin: 0 18px; }
    .next .meta { display: none; }
    .serial { display: none; }
    .slot + .slot { padding-left: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="ticket">

  <header class="masthead">
    <div class="seal" aria-hidden="true">
      <span class="seal-route">B3A</span>
      <span class="seal-sub">CITYBUS</span>
    </div>
    <div class="titles">
      <div class="kicker">Citybus · 城巴 · Route B3A</div>
      <h1 class="en">Fu Tai Estate <span class="arrow">⇄</span> Shenzhen Bay Port</h1>
      <div class="zh">富泰邨 ⇄ 深圳灣口岸</div>
    </div>
  </header>

  <div class="tear" aria-hidden="true"><span class="punch l"></span><span class="punch r"></span></div>

  <!-- Fu Tai Estate → Shenzhen Bay Port -->
  <section class="board" id="board-out">
    <div class="label-row">
      <span class="dir"><i class="mark"></i>To Shenzhen Bay Port · 往深圳灣口岸</span>
      <span class="serial">Stop 003261</span>
    </div>
    <div class="next">
      <div class="num" data-num>–</div>
      <div class="unit" data-unit>min</div>
      <div class="meta">
        <strong data-clock>--:--</strong>
        <span data-note>scheduled arrival</span>
      </div>
    </div>
    <div class="later">
      <div class="slot" data-slot="2">
        <div class="k">Following</div>
        <div class="v"><span data-v>–</span><span class="u" data-u>min</span></div>
        <div class="t" data-t>—</div>
      </div>
      <div class="slot" data-slot="3">
        <div class="k">Then</div>
        <div class="v"><span data-v>–</span><span class="u" data-u>min</span></div>
        <div class="t" data-t>—</div>
      </div>
    </div>
    <p class="board-note" data-err></p>
  </section>

  <div class="tear" aria-hidden="true"><span class="punch l"></span><span class="punch r"></span></div>

  <!-- Shenzhen Bay Port → Fu Tai Estate -->
  <section class="board secondary" id="board-ret">
    <div class="label-row">
      <span class="dir"><i class="mark"></i>To Fu Tai Estate · 往富泰邨</span>
      <span class="serial">Stop 003262</span>
    </div>
    <div class="next">
      <div class="num" data-num>–</div>
      <div class="unit" data-unit>min</div>
      <div class="meta">
        <strong data-clock>--:--</strong>
        <span data-note>predicted arrival</span>
      </div>
    </div>
    <div class="later">
      <div class="slot" data-slot="2">
        <div class="k">Following</div>
        <div class="v"><span data-v>–</span><span class="u" data-u>min</span></div>
        <div class="t" data-t>—</div>
      </div>
      <div class="slot" data-slot="3">
        <div class="k">Then</div>
        <div class="v"><span data-v>–</span><span class="u" data-u>min</span></div>
        <div class="t" data-t>—</div>
      </div>
    </div>
    <p class="board-note" data-err></p>
  </section>

  <div id="error" role="alert"></div>

  <div class="tear" aria-hidden="true"><span class="punch l"></span><span class="punch r"></span></div>

  <footer>
    <span class="dot" id="dot"></span>
    <span id="status">Loading…</span>
    <span class="spacer"></span>
    <span id="countdown">30s</span>
    <button id="refresh" type="button">Refresh</button>
  </footer>

</main>
<script>
(() => {
  "use strict";

  // Citybus (CTB) open data — DATA.GOV.HK "Real-time Next Bus" dataset, v2 API.
  const API = "https://rt.data.gov.hk/v2/transport/citybus/eta/CTB";
  const INTERVAL = 30; // seconds

  const BOARDS = {
    out: {
      el: document.getElementById("board-out"),
      stop: "003261",              // Fu Tai Estate, Castle Peak Road
      dir: "O",                    // outbound → Shenzhen Bay Port
      label: "Fu Tai Estate → Shenzhen Bay Port",
    },
    ret: {
      el: document.getElementById("board-ret"),
      stop: "003262",              // Fu Tai Shopping Centre, Castle Peak Road
      dir: "I",                    // inbound → Fu Tai Estate
      label: "Shenzhen Bay Port → Fu Tai Estate",
    },
  };

  const pad = (n) => String(n).padStart(2, "0");

  const ui = {
    status: document.getElementById("status"),
    countdown: document.getElementById("countdown"),
    dot: document.getElementById("dot"),
    error: document.getElementById("error"),
    refresh: document.getElementById("refresh"),
  };

  const state = {
    out: { etas: null, error: null, updated: null },
    ret: { etas: null, error: null, updated: null },
  };

  let loading = false;
  let secondsLeft = INTERVAL;
  let lastTick = Date.now();

  const hkTime = (d) =>
    new Intl.DateTimeFormat("en-GB", {
      timeZone: "Asia/Hong_Kong",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false,
    }).format(d);

  function minutesUntil(iso, now) {
    const t = new Date(iso).getTime();
    if (!Number.isFinite(t)) return null;
    return Math.round((t - now) / 60000);
  }

  function describe(mins) {
    if (mins === null) return { value: "–", unit: "min" };
    if (mins <= 0) return { value: "Now", unit: "" };
    if (mins === 1) return { value: "1", unit: "min" };
    return { value: String(mins), unit: "min" };
  }

  function setSlot(slotEl, eta, now) {
    const v = slotEl.querySelector("[data-v]");
    const u = slotEl.querySelector("[data-u]");
    const t = slotEl.querySelector("[data-t]");

    if (!eta) {
      slotEl.classList.add("empty");
      v.textContent = "No ETA";
      u.textContent = "";
      t.textContent = "—";
      return;
    }

    slotEl.classList.remove("empty");
    const d = describe(minutesUntil(eta.eta, now));
    v.textContent = d.value;
    u.textContent = d.unit;

    const remark = (eta.rmk_en || "").trim();
    t.textContent = hkTime(new Date(eta.eta)) + (remark ? " · " + remark : "");
  }

  function renderBoard(key) {
    const cfg = BOARDS[key];
    const s = state[key];
    const root = cfg.el;

    const num = root.querySelector("[data-num]");
    const unit = root.querySelector("[data-unit]");
    const clock = root.querySelector("[data-clock]");
    const note = root.querySelector("[data-note]");
    const slot2 = root.querySelector('[data-slot="2"]');
    const slot3 = root.querySelector('[data-slot="3"]');
    const err = root.querySelector("[data-err]");

    err.classList.toggle("show", Boolean(s.error));
    if (s.error) err.textContent = s.error;

    if (!s.etas) {
      num.textContent = "–";
      unit.textContent = "min";
      clock.textContent = "--:--";
      note.textContent = s.error ? "no data" : "loading…";
      setSlot(slot2, null);
      setSlot(slot3, null);
      return;
    }

    const now = Date.now();
    const seen = new Set();
    const buses = s.etas
      .filter((e) => e.dir === cfg.dir && e.stop === cfg.stop && e.eta)
      .map((e) => ({ ...e, mins: minutesUntil(e.eta, now) }))
      .filter((e) => e.mins !== null)
      // the inbound stop is listed twice in the route-stop feed (seq 2 and 3),
      // which can return the same arrival twice — keep one per timestamp.
      .filter((e) => (seen.has(e.eta) ? false : seen.add(e.eta)))
      .sort((a, b) => a.mins - b.mins);

    const first = buses[0];

    if (!first) {
      num.textContent = "–";
      num.classList.add("small");
      unit.textContent = "no ETA";
      clock.textContent = "--:--";
      note.textContent = "no live prediction";
    } else {
      const d = describe(first.mins);
      num.textContent = d.value;
      num.classList.toggle("small", d.value.length > 3);
      unit.textContent = d.unit;
      clock.textContent = hkTime(new Date(first.eta));
      const remark = (first.rmk_en || "").trim();
      note.textContent = remark ? remark : "predicted arrival";
    }

    setSlot(slot2, buses[1], now);
    setSlot(slot3, buses[2], now);
  }

  function render() {
    renderBoard("out");
    renderBoard("ret");
  }

  function setBusy(isBusy) {
    ui.dot.className = "dot" + (isBusy ? " busy" : "");
    ui.refresh.disabled = isBusy;
  }

  async function fetchBoard(key) {
    const cfg = BOARDS[key];
    const url =
      API + "/" + cfg.stop + "/B3A" + (API.includes("?") ? "&" : "?") + "t=" + Date.now();

    try {
      const res = await fetch(url, {
        cache: "no-store",
        headers: { Accept: "application/json" },
      });
      if (!res.ok) throw new Error("HTTP " + res.status);

      const json = await res.json();
      if (!json || json.type !== "ETA" || !Array.isArray(json.data)) {
        throw new Error("Unexpected response");
      }

      state[key] = { etas: json.data, error: null, updated: new Date() };
    } catch (err) {
      state[key] = {
        etas: state[key].etas, // keep last good data on screen
        error:
          "Couldn't load " + cfg.label + " (" +
          (err && err.message ? err.message : "network error") + ").",
        updated: state[key].updated,
      };
    }
  }

  async function load() {
    if (loading) return;
    loading = true;
    setBusy(true);
    if (!state.out.updated && !state.ret.updated) ui.status.textContent = "Fetching…";

    await Promise.all([fetchBoard("out"), fetchBoard("ret")]);

    const failed = ["out", "ret"].filter((k) => state[k].error);
    const times = ["out", "ret"]
      .map((k) => state[k].updated)
      .filter(Boolean)
      .sort((a, b) => b - a);

    if (failed.length) {
      ui.dot.className = "dot err";
      ui.status.textContent = failed.length === 2
        ? "Update failed — retrying"
        : "Partial update — one direction failed";
      ui.error.textContent =
        "Citybus ETA service unavailable for " +
        failed.map((k) => BOARDS[k].label).join(" and ") +
        ". Retrying every 30 seconds.";
      ui.error.classList.add("show");
    } else {
      ui.dot.className = "dot";
      ui.status.textContent = times.length
        ? "Live · updated " + hkTime(times[0])
        : "Waiting for data";
      ui.error.classList.remove("show");
    }

    render();

    loading = false;
    setBusy(false);
    secondsLeft = INTERVAL;
    lastTick = Date.now();
    updateCountdown();
  }

  function updateCountdown() {
    ui.countdown.textContent = secondsLeft + "s";
  }

  function tick() {
    const now = Date.now();
    const elapsed = Math.floor((now - lastTick) / 1000);
    if (elapsed > 0) {
      lastTick += elapsed * 1000;
      secondsLeft = Math.max(0, secondsLeft - elapsed);
    }

    updateCountdown();
    render(); // re-derive minute values as time passes

    if (secondsLeft <= 0) load();
  }

  ui.refresh.addEventListener("click", () => {
    secondsLeft = INTERVAL;
    lastTick = Date.now();
    load();
  });

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    const newest = Math.max(
      state.out.updated ? state.out.updated.getTime() : 0,
      state.ret.updated ? state.ret.updated.getTime() : 0
    );
    if (!newest || Date.now() - newest > INTERVAL * 1000) {
      secondsLeft = INTERVAL;
      lastTick = Date.now();
      load();
    }
  });

  load();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
